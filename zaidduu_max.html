<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAIDDDUU MAX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:Arial,Helvetica,sans-serif;color:white;overflow:hidden;
  background:#050505;
}
body::before{
  content:"";position:fixed;width:420px;height:420px;border-radius:50%;
  background:#833ab4;filter:blur(120px);opacity:.35;top:-100px;left:-100px;
}
body::after{
  content:"";position:fixed;width:380px;height:380px;border-radius:50%;
  background:#fd1d1d;filter:blur(130px);opacity:.25;right:-100px;bottom:-100px;
}
.card{
  position:relative;z-index:2;width:min(90%,430px);padding:48px 28px;
  text-align:center;border:1px solid rgba(255,255,255,.15);
  border-radius:28px;background:rgba(255,255,255,.07);
  backdrop-filter:blur(18px);box-shadow:0 25px 70px rgba(0,0,0,.5);
}
.logo{
  width:105px;height:105px;margin:0 auto 22px;border-radius:50%;
  display:grid;place-items:center;font-size:30px;font-weight:900;
  background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);
  box-shadow:0 0 35px rgba(225,48,108,.35);
}
h1{font-size:34px;letter-spacing:2px;margin-bottom:10px}
p{color:#cfcfcf;font-size:15px;margin-bottom:30px}
.btn{
  display:block;text-decoration:none;color:white;font-weight:800;
  padding:16px 22px;border-radius:14px;
  background:linear-gradient(90deg,#833ab4,#e1306c,#fd1d1d,#fcb045);
  transition:.25s;box-shadow:0 10px 30px rgba(225,48,108,.25);
}
.btn:hover{transform:translateY(-3px);box-shadow:0 15px 35px rgba(225,48,108,.4)}
.handle{margin-top:18px;font-size:13px;color:#aaa}
</style>
</head>
<body>
  <main class="card">
    <div class="logo">ZM</div>
    <h1>ZAIDDDUU MAX</h1>
    <p>Welcome to my world ✨</p>
    <a class="btn" href="https://www.instagram.com/zaiddduu___/" target="_blank" rel="noopener noreferrer">
      📸 Visit My Instagram
    </a>
    <div class="handle">@zaiddduu___</div>
  </main>
</body>
</html>
